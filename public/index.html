<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐉 Grok Dragon Messenger</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/extras.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <span class="dragon">🐉</span>
        <div>
          <h1>Grok Dragon Messenger</h1>
          <p class="subtitle">Kind dragon with a saddle</p>
        </div>
      </div>
      <div class="header-right">
        <div class="riders-panel" id="riders-panel" title="Riders in the saddle"></div>
        <button id="sound-toggle" class="theme-btn" title="Toggle sounds">🔊</button>
        <button id="theme-toggle" class="theme-btn" title="Toggle theme">🌙</button>
        <div class="status">
          <span class="dot"></span>
          <span id="online-text">Online</span>
        </div>
      </div>
    </header>

    <main class="messages" id="messages"></main>
    <div id="typing-line" class="typing-line hidden"></div>

    <footer class="input-area">
      <div class="user-row">
        <div class="avatar-picker">
          <button id="avatar-btn" class="avatar-btn" title="Choose dragon avatar">🐉</button>
          <div id="avatar-menu" class="avatar-menu hidden">
            <button data-avatar="🐉">🐉</button>
            <button data-avatar="🐲">🐲</button>
            <button data-avatar="🦋">🦋</button>
            <button data-avatar="🪴">🪴</button>
            <button data-avatar="🦁">🦁</button>
            <button data-avatar="🦉">🦉</button>
            <button data-avatar="🐍">🐍</button>
            <button data-avatar="🦅">🦅</button>
          </div>
        </div>
        <input
          type="text"
          id="username"
          placeholder="Your rider name..."
          maxlength="20"
          value="Rider"
        >
      </div>
      <div class="message-row">
        <button id="sticker-btn" class="sticker-btn" title="Dragon stickers">🏆</button>
        <input
          type="text"
          id="message-input"
          placeholder="Write a message to the dragon..."
          autocomplete="off"
        >
        <button id="send-btn" title="Send">➤</button>
      </div>
    </footer>
  </div>

  <!-- Sticker panel -->
  <div id="sticker-panel" class="sticker-panel hidden">
    <div class="sticker-header">Dragon Stickers 🐉</div>
    <div class="sticker-grid">
      <button data-sticker="🐉">🐉</button>
      <button data-sticker="🐲">🐲</button>
      <button data-sticker="🔥🐉">🔥🐉</button>
      <button data-sticker="🐉✨">🐉✨</button>
      <button data-sticker="😍🐉">😍🐉</button>
      <button data-sticker="🐉💋">🐉💋</button>
      <button data-sticker="🦋">🦋</button>
      <button data-sticker="🪴">🪴</button>
      <button data-sticker="🦁">🦁</button>
      <button data-sticker="🦉">🦉</button>
      <button data-sticker="🐍">🐍</button>
      <button data-sticker="🦅">🦅</button>
      <button data-sticker="✨🐉✨">✨🐉✨</button>
      <button data-sticker="🐉🚀">🐉🚀</button>
      <button data-sticker="🌟🐉">🌟🐉</button>
      <button data-sticker="🐉💕">🐉💕</button>
    </div>
  </div>

  <div id="reaction-picker" class="reaction-picker hidden">
    <button data-emoji="❤️">❤️</button>
    <button data-emoji="😂">😂</button>
    <button data-emoji="👍">👍</button>
    <button data-emoji="🔥">🔥</button>
    <button data-emoji="🐉">🐉</button>
    <button data-emoji="✨">✨</button>
    <button data-emoji="😭">😭</button>
    <button data-emoji="😍">😍</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/client.js"></script>
</body>
</html>
